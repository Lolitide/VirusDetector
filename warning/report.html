<!DOCTYPE html>
<html lang="zh-CN" style="display: none;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全风险报告 - 银狐木马检测</title>
  <script src="../popup/theme-init.js"></script>
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <main class="report">
    <header class="report-header">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
        <path d="M12 2 1 22h22L12 2Z" fill="#fff" opacity=".95"/>
        <path d="M12 9v5m0 3.5v.5" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <h1>安全风险警告</h1>
      <p>银狐木马检测系统</p>
    </header>

    <section class="risk-summary">
      <div class="risk-score">
        <span>风险评分</span>
        <strong id="report-score">--</strong>
      </div>
      <div>
        <strong>该网站被识别为疑似钓鱼或恶意网站</strong>
        <p>请勿输入个人信息、账号密码或进行支付操作。</p>
      </div>
    </section>

    <section class="site-info">
      <div><span>当前网站</span><strong id="report-domain">--</strong></div>
      <div><span>检测时间</span><strong id="report-time">--</strong></div>
    </section>

    <section class="official" id="official-section" hidden>
      <strong>推荐的官方网站</strong>
      <span id="official-domain">--</span>
      <a id="official-link" href="#" target="_blank" rel="noreferrer">前往官方网站</a>
    </section>

    <section class="tips">
      <h2>安全建议</h2>
      <ul>
        <li>不要在可疑网站输入任何个人信息</li>
        <li>不要下载或运行该网站提供的文件</li>
        <li>不要在该网站进行登录或支付操作</li>
        <li>通过官方渠道或应用商店下载软件</li>
      </ul>
    </section>

    <div class="report-actions">
      <button id="btn-close-report" type="button">关闭此页面</button>
      <button id="btn-back-safe" class="primary" type="button">返回安全页面</button>
    </div>
    <button id="btn-report-false" class="false-positive" type="button">此检测有误（误报）</button>
    <p id="countdown" class="countdown"></p>
  </main>
  <script src="report.js"></script>
</body>
</html>
