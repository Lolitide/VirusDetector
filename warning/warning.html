<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面已拦截 - 银狐木马检测</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <main class="interstitial" aria-labelledby="warning-title">
    <header class="brand" aria-label="银狐木马检测">
      <img src="../icons/icon48.png" width="28" height="28" alt="">
      <span>银狐木马检测</span>
    </header>

    <section class="warning-content">
      <div class="risk-rule" aria-hidden="true"></div>
      <h1 id="warning-title">这个页面已被拦截</h1>
      <p class="summary">银狐在你继续访问前发现了高风险信号。为保护账号和文件安全，页面内容没有继续显示。</p>

      <div class="site" aria-label="被拦截的网站">
        <span>被拦截的网站</span>
        <strong id="info-domain">正在读取</strong>
      </div>

      <div class="actions" aria-label="安全操作">
        <button id="btn-back" class="button button-primary" type="button">回退</button>
        <button id="btn-ask-ai" class="button button-secondary" type="button">
          <span>询问 AI</span>
          <small>doubao.com</small>
        </button>
      </div>

      <button id="btn-review-trust" class="trust-link" type="button">我仍然信任这个网站</button>
      <p id="page-status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="trust-dialog" class="trust-dialog" aria-labelledby="trust-title" aria-describedby="trust-description">
    <div class="dialog-body">
      <h2 id="trust-title">你确认信任它吗？</h2>
      <p id="trust-description">信任后，银狐将允许这个网站继续打开，并跳过后续检测。</p>

      <div class="score-panel">
        <span>威胁评分</span>
        <strong id="risk-score">0</strong>
      </div>
      <p class="dialog-domain" id="dialog-domain">正在读取</p>

      <div class="dialog-actions">
        <button id="btn-confirm-trust" class="button button-danger" type="button">是的，我信任它</button>
        <button id="btn-cancel-trust" class="button button-quiet" type="button">不，我反悔了</button>
      </div>
      <p id="dialog-status" class="status" role="status" aria-live="polite"></p>
    </div>
  </dialog>

  <script src="warning.js"></script>
</body>
</html>
